name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: docst-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            archive: docst-win-x64.zip
          - os: macos-latest
            rid: osx-arm64
            archive: docst-osx-arm64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Publish
        run: >
          dotnet publish docst/docst.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -o out

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C out docst

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out\docst.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docst-osx-arm64.tar.gz

      - name: Compute SHA256
        id: sha256
        run: echo "value=$(sha256sum docst-osx-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Clone tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/amaurybennett/homebrew-docst.git tap

      - name: Generate formula
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ steps.sha256.outputs.value }}
        run: |
          python3 - <<'PY'
          import os, textwrap
          tag     = os.environ["TAG"]
          version = os.environ["VERSION"].lstrip("v")
          sha256  = os.environ["SHA256"]
          formula = textwrap.dedent(f"""\
            # typed: true
            # frozen_string_literal: true

            class Docst < Formula
              desc "Convertit des fichiers .docx en Typst (.typ) et Markdown/EPUB (.md)"
              homepage "https://github.com/amaurybennett/docst"
              license "MIT"
              version "{version}"

              on_macos do
                if Hardware::CPU.arm?
                  url "https://github.com/amaurybennett/docst/releases/download/{tag}/docst-osx-arm64.tar.gz"
                  sha256 "{sha256}"
                end
              end

              def install
                bin.install "docst"
              end

              test do
                system "#{{bin}}/docst", "--help"
              end
            end
          """)
          with open("tap/Formula/docst.rb", "w") as f:
              f.write(formula)
          PY

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd tap
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/docst.rb
          git commit -m "chore: bump docst to ${TAG}"
          git push
